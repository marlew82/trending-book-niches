{% extends "base.html" %}

{% block title %}Server Error - Amazon Book Trends Analyzer{% endblock %}

{% block content %}
<div class="container">
    <div class="empty-state" style="padding: 6rem 2rem;">
        <svg width="120" height="120" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-bottom: 2rem; color: var(--danger-color);">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <h1 style="font-size: 3rem; margin-bottom: 1rem;">500</h1>
        <h2 style="margin-bottom: 1rem;">Internal Server Error</h2>
        <p style="max-width: 500px; margin: 0 auto 2rem;">
            Oops! Something went wrong on our end. Please try again later or contact support if the problem persists.
        </p>
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <a href="/" class="btn btn-primary">Go to Dashboard</a>
            <button onclick="location.reload()" class="btn btn-secondary">Retry</button>
        </div>
    </div>
</div>
{% endblock %}
