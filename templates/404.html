{% extends "base.html" %}

{% block title %}Page Not Found - Amazon Book Trends Analyzer{% endblock %}

{% block content %}
<div class="container">
    <div class="empty-state" style="padding: 6rem 2rem;">
        <svg width="120" height="120" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="margin-bottom: 2rem;">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <h1 style="font-size: 3rem; margin-bottom: 1rem;">404</h1>
        <h2 style="margin-bottom: 1rem;">Page Not Found</h2>
        <p style="max-width: 500px; margin: 0 auto 2rem;">
            Sorry, we couldn't find the page you're looking for. The page may have been moved or doesn't exist.
        </p>
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <a href="/" class="btn btn-primary">Go to Dashboard</a>
            <a href="/trending" class="btn btn-secondary">View Trending</a>
        </div>
    </div>
</div>
{% endblock %}
